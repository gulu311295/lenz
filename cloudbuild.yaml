substitutions:
  _REGION: asia-south1

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-api:$COMMIT_SHA
      - backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-api:$COMMIT_SHA

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sentiment-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --set-env-vars=UPLOAD_DIR=/tmp/uploads
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --min-instances=1
      - --no-cpu-throttling

  - id: resolve-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe sentiment-api --region=${_REGION} --format='value(status.url)')
        echo "$$API_URL" > /workspace/API_URL
        echo "Resolved API_URL=$$API_URL"

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/API_URL)
        docker build -f frontend/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-ui:$COMMIT_SHA \
          --build-arg VITE_API_BASE_URL=$$API_URL \
          frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-ui:$COMMIT_SHA

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sentiment-ui
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-ui:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run/sentiment-ui:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
